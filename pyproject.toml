[project]
name = "skill-evolve"
version = "0.4.0"
description = "Auditable SQL Skill evaluation workflow shell for DeepSeek Harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8.0,<9",
  "ruff>=0.8,<1",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
skill-evolve = "skill_evolve.cli:main"

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_evolve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["docker: requires a running local Docker daemon"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
