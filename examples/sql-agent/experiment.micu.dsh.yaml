schema_version: v1
experiment: sales-sql-skill

environment:
  model:
    provider: micu
    name: deepseek-v4-flash-0731
    params:
      temperature: 0
  dsh:
    version: 0.1.1-rc.2
    profile: headless
    profile_patch: dsh-no-web.patch.yml
    runner: dsh
    binary: dsh
    runner_args: []
    timeout_ms: 300000
  tools:
    - id: sql-readonly
      version: 1.0.0
      manifest: tools/sql-readonly.json
  database:
    kind: postgresql
    image: postgres:16.6
    image_digest: sha256:557fea37a744d5f4c8faab304b0a90858b53ab119735a88c131fd19dab802f36
    schema: fixtures/schema.sql
    seed: fixtures/seed.sql
  evaluator:
    version: sql-result-v1
    result_order: ignore
    numeric_tolerance: 0
    max_rows: 1000
    timeout_ms: 5000
  optimizer:
    enabled: false
    max_input_bytes: 1572864

cases:
  - id: customer-count
    slice: fast
    prompt: 每个国家有多少客户？
    expected_query: |
      SELECT country, COUNT(*) AS customer_count
      FROM customers
      GROUP BY country
